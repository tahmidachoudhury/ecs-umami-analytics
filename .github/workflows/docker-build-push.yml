name: Docker Build & Push

on:
  push:
    branches:
      - main
    paths:
      - "app/**"
  workflow_dispatch:

env:
  ECR_REPOSITORY: ${{secrets.ECR_REPOSITORY}}
  AWS_REGION: ${{secrets.AWS_REGION}}

permissions:
  id-token: write
  contents: read

jobs:
  lint-and-test:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: app
        run: pnpm install --frozen-lockfile

      - name: Run Tests
        working-directory: app
        run: pnpm test

      - name: Build app
        working-directory: app
        env:
          DATABASE_URL: postgresql://dummy:dummy@localhost:5432/dummy
        run: pnpm build

  build-and-push:
    name: Push to ECR
    runs-on: ubuntu-latest
    needs: lint-and-test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6.1.0
        with:
          aws-region: ${{secrets.AWS_REGION}}
          role-to-assume: ${{secrets.AWS_IAM_ARN}}
          role-session-name: github-actions-ecr-push

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: app/
          file: app/Dockerfile
          push: true
          # change the no-cache to make the pipeline faster
          no-cache: true
          tags: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}

      - name: Deploy to ECS
        env:
          CLUSTER: umami-ecs-app-dev-cluster
          SERVICE: umami-ecs-app-service
          FAMILY: umami-ecs-app-task
          CONTAINER: app
          IMAGE_URI: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
        run: |
          set -euo pipefail
          echo "Deploying $IMAGE_URI to $CLUSTER/$SERVICE"

          TASK_DEF=$(aws ecs describe-task-definition \
            --task-definition "$FAMILY" \
            --query 'taskDefinition' \
            --output json)

          NEW_TASK_DEF=$(echo "$TASK_DEF" | jq \
            --arg IMAGE "$IMAGE_URI" \
            --arg NAME "$CONTAINER" \
            '(.containerDefinitions[] | select(.name == $NAME) | .image) = $IMAGE
             | del(.taskDefinitionArn, .revision, .status, .requiresAttributes,
                   .compatibilities, .registeredAt, .registeredBy, .deregisteredAt)')

          NEW_TASK_ARN=$(aws ecs register-task-definition \
            --cli-input-json "$NEW_TASK_DEF" \
            --query 'taskDefinition.taskDefinitionArn' \
            --output text)

          echo "Registered $NEW_TASK_ARN"

          aws ecs update-service \
            --cluster "$CLUSTER" \
            --service "$SERVICE" \
            --task-definition "$NEW_TASK_ARN" \
            --no-cli-pager > /dev/null

      - name: Wait for deployment
        env:
          CLUSTER: umami-ecs-app-dev-cluster
          SERVICE: umami-ecs-app-service
        run: |
          set -euo pipefail
          for i in $(seq 1 60); do
            read -r STATE REASON <<< "$(aws ecs describe-services \
              --cluster "$CLUSTER" --services "$SERVICE" \
              --query 'services[0].deployments[?status==`PRIMARY`].[rolloutState,rolloutStateReason]' \
              --output text)"

            echo "[$i] $STATE ${REASON:-}"

            case "$STATE" in
              COMPLETED) exit 0 ;;
              FAILED)    echo "Deployment failed: $REASON"; exit 1 ;;
            esac
            sleep 10
          done

          echo "Timed out after 10 minutes"
          exit 1
